name: Test build

# Builds an importable Companion package for every push, with a unique test
# version (see scripts/set-test-version.mjs). Download it from the run's
# Artifacts section, unzip, and import the .tgz into Companion.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  # Write access is needed to update the rolling "test-build" pre-release.
  contents: write

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package test build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js from .node-version
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Prepare Environment
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Set unique test version
        id: version
        run: node scripts/set-test-version.mjs "${{ github.run_number }}" "${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: yarn test
      - name: Package
        run: yarn package --prerelease
      - name: Verify package
        run: yarn package:verify
      - name: Upload test build
        uses: actions/upload-artifact@v6
        with:
          name: iconnectivity-interfaces-${{ steps.version.outputs.version }}
          path: pkg/iconnectivity-interfaces-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Publish to the rolling "Latest test build" pre-release
        # A plain .tgz download (no zip) at a fixed URL that always holds the newest build.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag=test-build
          file="pkg/iconnectivity-interfaces-${VERSION}.tgz"
          notes="Newest automatic test build: **${VERSION}** from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}.

          Download the .tgz below and import it in Companion. This is a test build for trying changes, not a Candidate or Production release. It is replaced by every new push."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create "$tag" --prerelease --title "Latest test build" --target "$GITHUB_SHA" --notes "$notes"
          fi
          gh release upload "$tag" "$file" --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' | while read -r name; do
            if [ "$name" != "$(basename "$file")" ]; then gh release delete-asset "$tag" "$name" --yes; fi
          done
          gh release edit "$tag" --prerelease --title "Latest test build ${VERSION}" --notes "$notes"
      - name: Summary
        run: |
          {
            echo "### Companion test build: \`${{ steps.version.outputs.version }}\`"
            echo
            echo "Easiest: download the \`.tgz\` from the [Latest test build](${{ github.server_url }}/${{ github.repository }}/releases/tag/test-build) release page and import it in Companion."
            echo "The same file is also under *Artifacts* below (GitHub zips it; unzip to get the \`.tgz\`)."
            echo "This is a test build, not a Candidate or Production release."
          } >> "$GITHUB_STEP_SUMMARY"
