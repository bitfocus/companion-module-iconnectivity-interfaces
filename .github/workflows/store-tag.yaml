name: Store version tag

# In the Bitfocus copy, labels each new store version automatically: when
# main's package.json holds a plain version (for example 1.0.1) that has no
# v-tag yet, it creates v<version> on that commit. The version can then be
# submitted in the Bitfocus Developer Portal. Existing tags are never moved.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag store version
    if: github.repository == 'bitfocus/companion-module-iconnectivity-interfaces'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the version tag if it is new
        run: |
          version=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./companion/manifest.json').version")
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "package.json version $version is not a plain store version; nothing to tag."
            exit 0
          fi
          if [ "$version" != "$manifest" ]; then
            echo "::error::package.json ($version) and companion/manifest.json ($manifest) disagree; not tagging."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "$version"
          git push origin "refs/tags/v$version"
          echo "Created v$version. Submit it in the Bitfocus Developer Portal."
